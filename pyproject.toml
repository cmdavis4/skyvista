[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyvista"
version = "1.3.0"
description = "PyVista-based 3D visualization for atmospheric data"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Charles Davis", email = "cmdavis4@colostate.edu"}
]
keywords = ["visualization", "pyvista", "atmospheric", "3d", "meteorology", "trajectories"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyvista[all]>=0.47.1",
    "trame",
    "numpy",
    "xarray",
    "matplotlib",
    "carlee-tools>=2.0.0",
    "ipython",
    "tqdm",
    "ipywidgets"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]
# Blender export backend. 'alembic3d' is the 3D Alembic bindings (NOT the
# SQLAlchemy 'alembic' database-migration tool) for the mesh carrier. Wheels
# currently cover CPython 3.10-3.13, so pin away from 3.14 until upstream ships
# those wheels.
#
# *Volume* (VDB) export needs the OpenVDB Python bindings, which have NO PyPI
# wheel for recent Python. The bpy wheel bundles a copy built for its CPython,
# and skyvista loads that copy when no other 'openvdb' module is installed, so
# this extra covers volumes too. conda-forge's 'openvdb' takes precedence when
# present (the pixi 'blender' environment).
#
# 'imageio-ffmpeg' ships an ffmpeg binary, which BlenderAnimation uses to encode
# videos when no other ffmpeg is found.
#
# 'bpy' is Blender itself, built as a Python module, so building and rendering
# need no separate Blender install. bpy 5.1+ ships wheels only for CPython 3.13,
# and only on Linux x86-64, Apple-silicon macOS and Windows. Elsewhere, point
# skyvista at a standalone Blender program ($SKYVISTA_BLENDER) instead.
blender = [
    "alembic3d; python_version < '3.14'",
    "bpy>=5.1,<6; python_version == '3.13' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'win32')",
    "imageio-ffmpeg",
]
# What the example notebooks in examples/notebooks need beyond the Blender
# extra: xarrams reads RAMS and CM1 output, hdf5plugin decompresses ZFP-
# compressed RAMS output, and JupyterLab runs the notebooks.
notebooks = [
    "skyvista[blender]",
    "xarrams>=1.1.0",
    "hdf5plugin",
    "jupyterlab",
]

[project.urls]
Homepage = "https://github.com/cmdavis4/skyvista"
"Bug Tracker" = "https://github.com/cmdavis4/skyvista/issues"
Documentation = "https://github.com/cmdavis4/skyvista#readme"
"Source Code" = "https://github.com/cmdavis4/skyvista"

[tool.setuptools]
packages = ["skyvista", "skyvista.presets"]

[tool.setuptools.package-data]
skyvista = ["py.typed", "blender_assets/*.py"]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
